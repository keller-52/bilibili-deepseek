# bili-duty 的唯一参数来源：<工作区>/config/config.yaml
# 本机路径按仓库根目录解析（相对路径），换盘不用改。
# ============================================================================
# 唯一参数来源。bili-guard 读取，主 Agent 无写权限。
# 改这里 = 改行为；改提示词无效。
# 默认值偏保守，跑两周后按 audit.jsonl 的实际用量再调。
# ============================================================================

schedule:
  only_offpeak: true              # 只在谷时运行（工作日 12-14、18-09，周末全天）
  windows:
    noon:  ["12:00", "14:00"]
    night: ["18:00", "09:00"]
  weekend_all_day: true
  session_max_minutes: 40         # 单次会话上限
  stop_write_before_end_min: 10   # 窗口结束前 10 分钟停写

# ---------------------------------------------------------------------------
# L1：轻互动
# ---------------------------------------------------------------------------
l1:
  like_per_day: 20
  coin_per_day: 1                 # 硬币稀缺，先 1；避免过早清空
  favorite_per_day: 10

# ---------------------------------------------------------------------------
# L2：文本互动
# ---------------------------------------------------------------------------
l2:
  # 评论 / 回复（三个维度同时生效，任一超限即拒）
  comment_per_video: 1            # 同一个视频最多 1 条主评论
  reply_per_root: 2               # 同一条根评论下最多 2 条回复
  comment_per_day: 3
  reply_per_day: 10
  total_per_day: 10               # 评论 + 回复合计
  per_person_per_day: 1           # 同一个人每天最多 1 条（防拉锯）
  danmaku_per_day: 5

  # 私信：好友白名单，已知情，配额放宽
  dm_per_day: 10
  dm_per_person_per_day: 3
  dm_min_interval_sec: 300        # 最小间隔 5 分钟
  dm_allowlist_only: true         # 硬约束：只能发给白名单
  dm_require_human: false         # 好友已知情，默认免人工；重要消息可临时打开
  dm_allow_links: false           # 私信里不放链接

# ---------------------------------------------------------------------------
# L3：发布（默认关闭，日 1 篇，必须人审）
# ---------------------------------------------------------------------------
l3:
  enabled: false                  # 能力闸：默认不注册 L3 工具
  dynamic_per_day: 1
  dynamic_require_human: true
  video_upload: disabled          # 投稿视频全人工，Agent 只出素材

# ---------------------------------------------------------------------------
# 审核：生成与审核分离
# ---------------------------------------------------------------------------
review:
  rule_engine: true               # 确定性规则，代码层，不可绕过
  ai_reviewer: independent        # 独立会话 + 固定提示词，只看内容
  human_required: true            # 默认人工必经；AUTO 通道下可豁免

# ---------------------------------------------------------------------------
# AUTO 通道：白名单动作自动化
# ---------------------------------------------------------------------------
auto:
  enabled: false                  # 需满足全部前置条件后手动打开
  allowed_actions:
    - dm_owner                    # 私信账号持有者本人
    - reply_owner                 # 回复账号持有者本人的留言
    - short_comment               # ≤50 字、白名单主题的评论
  min_clean_days: 14              # 连续无风控天数
  min_verified_count: 20          # 累计核验可见条数
  audit_sample_rate: 0.2          # 人工抽检比例
  disable_on_any_incident: true   # 任意异常立即关闭

# ---------------------------------------------------------------------------
# 闸门与风控
# ---------------------------------------------------------------------------
guard:
  min_interval_sec: 20            # 导航/通用最小间隔
  jitter_sec: [3, 12]             # 随机抖动
  killed_file: STOP               # 存在即全停
  cooldown_after_risk_days: 7     # 风控后冷却
  cooldown_after_takedown_days: 30
  quiet_hours: ["00:00", "07:00"] # 夜间不做写操作

# ---------------------------------------------------------------------------
# 路径
# 相对路径按工作区根目录解析（本项目 = 仓库根目录），换盘 / 换目录不用改。
# 如果要用绝对路径：正斜杠 /，含空格要加引号。
# ---------------------------------------------------------------------------
paths:
  home: runtime
  config_dir: config
  allowlist: dm-allowlist.json    # 相对 config_dir
  audit: audit/audit.jsonl        # 相对 home
  memory: memory/                 # 相对 home
  drafts: drafts/                 # 相对 home
  logs: duty.log                  # 相对 home
